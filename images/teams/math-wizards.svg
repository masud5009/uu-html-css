<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e2de2"/>
      <stop offset="50%" stop-color="#4a00e0"/>
      <stop offset="100%" stop-color="#20003b"/>
    </linearGradient>
    <linearGradient id="grad-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20003b"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e2de2"/>
      <stop offset="100%" stop-color="#4a00e0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer Metallic Shield Frame -->
    <path d="M 250 20 L 440 60 C 440 220 390 380 250 490 C 110 380 60 220 60 60 Z" 
          fill="url(#grad-border)" stroke="#8e2de2" stroke-width="4"/>

    <!-- Inner Shield Rim -->
    <path d="M 250 42 L 416 78 C 416 215 372 355 250 458 C 128 355 84 215 84 78 Z" 
          fill="#0c101c" stroke="#4a00e0" stroke-width="2" opacity="0.95"/>

    <!-- Shield Core Ground -->
    <path d="M 250 55 L 400 90 C 400 210 360 338 250 435 C 140 338 100 210 100 90 Z" 
          fill="url(#grad-inner)"/>

    <!-- Radial / Grid Accents -->
    <circle cx="250" cy="235" r="130" fill="none" stroke="#8e2de2" stroke-width="1.5" opacity="0.2"/>
    <circle cx="250" cy="235" r="95" fill="none" stroke="#4a00e0" stroke-width="1.5" opacity="0.25"/>

    <!-- Mascot Emblem Artwork -->
    
          <!-- Arcane Wizard Hat & Geometric Star -->
          <polygon points="250,110 320,250 180,250" fill="#4a00e0" stroke="#f39c12" stroke-width="4"/>
          <ellipse cx="250" cy="250" rx="90" ry="25" fill="#20003b" stroke="#f39c12" stroke-width="4"/>
          <!-- Pi Symbol & Infinity -->
          <text x="250" y="325" font-family="'Oswald', sans-serif" font-weight="900" font-size="46" fill="#f1c40f" text-anchor="middle">&#960;</text>
          <!-- Stars -->
          <polygon points="250,165 255,178 268,178 258,186 261,198 250,190 239,198 242,186 232,178 245,178" fill="#f1c40f"/>
        

    <!-- Top Ribbon Header Plaque -->
    <path d="M 100 50 L 250 15 L 400 50 L 375 92 L 250 72 L 125 92 Z" 
          fill="url(#grad-border)" stroke="#8e2de2" stroke-width="2"/>
    <text x="250" y="58" font-family="'Oswald', Impact, sans-serif" font-weight="900" font-size="24" 
          fill="#ffffff" text-anchor="middle" letter-spacing="2.5">MATH WIZARDS</text>

    <!-- Bottom Department Badge -->
    <rect x="160" y="440" width="180" height="30" rx="15" fill="#4a00e0" opacity="0.95"/>
    <text x="250" y="461" font-family="'Poppins', sans-serif" font-weight="800" font-size="13" 
          fill="#000000" text-anchor="middle" letter-spacing="1.5">DEPT. OF MATH</text>
  </g>
</svg>