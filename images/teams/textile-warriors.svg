<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="50%" stop-color="#ff4b2b"/>
      <stop offset="100%" stop-color="#8a0026"/>
    </linearGradient>
    <linearGradient id="grad-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a0026"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer Metallic Shield Frame -->
    <path d="M 250 20 L 440 60 C 440 220 390 380 250 490 C 110 380 60 220 60 60 Z" 
          fill="url(#grad-border)" stroke="#ff416c" stroke-width="4"/>

    <!-- Inner Shield Rim -->
    <path d="M 250 42 L 416 78 C 416 215 372 355 250 458 C 128 355 84 215 84 78 Z" 
          fill="#0c101c" stroke="#ff4b2b" stroke-width="2" opacity="0.95"/>

    <!-- Shield Core Ground -->
    <path d="M 250 55 L 400 90 C 400 210 360 338 250 435 C 140 338 100 210 100 90 Z" 
          fill="url(#grad-inner)"/>

    <!-- Radial / Grid Accents -->
    <circle cx="250" cy="235" r="130" fill="none" stroke="#ff416c" stroke-width="1.5" opacity="0.2"/>
    <circle cx="250" cy="235" r="95" fill="none" stroke="#ff4b2b" stroke-width="1.5" opacity="0.25"/>

    <!-- Mascot Emblem Artwork -->
    
          <!-- Crossed Cricket Bats & Spartan Shield -->
          <rect x="235" y="130" width="30" height="200" rx="6" transform="rotate(40 250 230)" fill="#d4af37" stroke="#ffffff" stroke-width="2"/>
          <rect x="235" y="130" width="30" height="200" rx="6" transform="rotate(-40 250 230)" fill="#d4af37" stroke="#ffffff" stroke-width="2"/>
          <!-- Warrior Helmet -->
          <path d="M 200 200 C 200 150 300 150 300 200 L 310 280 L 280 320 L 250 340 L 220 320 L 190 280 Z" fill="#2d0b16" stroke="#ff416c" stroke-width="4"/>
          <path d="M 250 140 L 250 240 M 215 220 L 285 220" stroke="#d4af37" stroke-width="6"/>
          <circle cx="250" cy="220" r="14" fill="#ff416c"/>
        

    <!-- Top Ribbon Header Plaque -->
    <path d="M 100 50 L 250 15 L 400 50 L 375 92 L 250 72 L 125 92 Z" 
          fill="url(#grad-border)" stroke="#ff416c" stroke-width="2"/>
    <text x="250" y="58" font-family="'Oswald', Impact, sans-serif" font-weight="900" font-size="24" 
          fill="#ffffff" text-anchor="middle" letter-spacing="2.5">TEXTILE WARRIORS</text>

    <!-- Bottom Department Badge -->
    <rect x="160" y="440" width="180" height="30" rx="15" fill="#ff4b2b" opacity="0.95"/>
    <text x="250" y="461" font-family="'Poppins', sans-serif" font-weight="800" font-size="13" 
          fill="#000000" text-anchor="middle" letter-spacing="1.5">DEPT. OF TEXTILE</text>
  </g>
</svg>